<title>Vidisha Ethnics</title><meta name="robots" content="noindex">
<script>
/* Old Shopify links (products, collections, pages) land on the right part of the new site. */
(function(){var p=location.pathname.toLowerCase(),t='/';
 if(/^\/(products|collections)(\/|$)/.test(p)){t=/saree/.test(p)?'/#shop-sarees':/kurti|kurta(?!-set)/.test(p)&&!/set/.test(p)?'/#shop-kurtas':/set/.test(p)?'/#shop-kurta-sets':'/#shop'}
 else if(/^\/pages\/(about|our-story|story)/.test(p))t='/#story';
 else if(/^\/pages\/(contact)/.test(p))t='/#contact';
 else if(/^\/(pages\/)?(shipping|policies|policy|refund|return)/.test(p))t='/#shipping';
 else if(/^\/(cart|checkout)/.test(p))t='/#bag';
 location.replace(t);})();
</script></head>
